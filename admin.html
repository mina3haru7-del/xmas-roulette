<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#163d2a">
<title>ルーレットURL発行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .card + .card { margin-top: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; color: var(--green-dark); }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; color: var(--ink);
    border: 2px solid #e2d3b3; border-radius: 12px; background: #fff;
  }
  input:focus { outline: none; border-color: var(--gold); }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .names input { text-align: center; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .primary {
    width: 100%; margin-top: 16px; padding: 14px; font-size: 17px; color: #fff;
    background: linear-gradient(180deg, #e2273f, var(--red)); box-shadow: 0 4px 0 var(--red-dark);
  }
  .person { padding: 12px 0; border-top: 1px dashed #e2d3b3; }
  .person:first-of-type { border-top: 0; padding-top: 0; }
  .person .nm { font-weight: 700; font-size: 17px; margin-bottom: 8px; }
  .person .acts { display: flex; gap: 8px; }
  .person .acts .btn { flex: 1; padding: 10px 8px; font-size: 14px; }
  .line { background: #06c755; color: #fff; text-decoration: none; }
  .copy { background: var(--gold-light); color: var(--ink); }
  .ok { color: var(--green); font-weight: 700; font-size: 14px; margin: 0 0 10px; }
  .warn { font-size: 13px; line-height: 1.7; color: var(--muted); margin: 10px 0 0; }
  .redo { width: 100%; margin-top: 14px; padding: 10px; font-size: 14px; background: #eee3cc; color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px;
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="garland" aria-hidden="true">🎄 🎁 🔔 🎁 🎄</div>
  <h1>プレゼント交換<br>URL発行ページ</h1>
  <p class="sub">主催者用です。参加者には送らないでね</p>

  <section class="card" id="setup">
    <h2>① 参加者</h2>
    <div class="names" id="names"></div>
    <div class="row2">
      <div><label for="budget">予算（任意）</label><input id="budget" placeholder="例：3,000円"></div>
      <div><label for="date">交換する日（任意）</label><input id="date" placeholder="例：12/25 夜"></div>
    </div>
    <button class="btn primary" id="make">🎲 割り当てを決めてURLを作る</button>
    <p class="warn">ボタンを押すと、だれがだれに渡すかがランダムに決まります。<br>結果はこの画面には表示されません（主催者にもわかりません）。</p>
  </section>

  <section class="card" id="links" hidden>
    <h2>② それぞれにURLを送る</h2>
    <p class="ok" id="check"></p>
    <div id="list"></div>
    <p class="warn">
      ・URLは<b>本人にだけ</b>送ってください。<br>
      ・ほかの人のURLを開くと、その人の相手がわかってしまうので開かないでね。<br>
      ・この画面は、同じスマホ／パソコンで開けばあとから何度でも表示できます。
    </p>
    <button class="btn redo" id="redo">割り当てをやり直す</button>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script src="common.js"></script>
<script>
(() => {
  letItSnow(24);
  const $ = (id) => document.getElementById(id);
  const STORE = "xmas-roulette-links-v1";
  const DEFAULT_NAMES = ["じいじ", "ばあば", "まなみ", "あっくん", "はる", "りゅう"];

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } },
    set(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); return true; } catch { return false; } },
    clear() { try { localStorage.removeItem(STORE); } catch {} },
  };

  DEFAULT_NAMES.forEach((nm, i) => {
    const input = document.createElement("input");
    input.value = nm;
    input.setAttribute("aria-label", `参加者${i + 1}`);
    input.maxLength = 8;
    $("names").appendChild(input);
  });

  function toast(msg) {
    $("toast").textContent = msg;
    $("toast").hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => ($("toast").hidden = true), 1800);
  }

  function baseUrl() {
    return new URL("./", location.href).href;
  }

  function message(name, url) {
    return `🎄 ${name}さんへ\nクリスマスのプレゼント交換ルーレットです！\nあなた専用のURLなので、ほかの人には見せないでね🤫\n\n${url}`;
  }

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast("コピーしました");
  }

  function render(saved) {
    $("setup").hidden = true;
    $("links").hidden = false;
    $("check").textContent = `✅ ${saved.people.length}人全員が「1人に渡して、1人からもらう」ように決まりました`;
    const list = $("list");
    list.innerHTML = "";
    for (const p of saved.people) {
      const row = document.createElement("div");
      row.className = "person";
      const nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = `🎁 ${p.name}さん`;
      const acts = document.createElement("div");
      acts.className = "acts";
      const line = document.createElement("a");
      line.className = "btn line";
      line.textContent = "LINEで送る";
      line.href = "https://line.me/R/msg/text/?" + encodeURIComponent(message(p.name, p.url));
      line.target = "_blank";
      line.rel = "noopener";
      const cp = document.createElement("button");
      cp.className = "btn copy";
      cp.textContent = "URLをコピー";
      cp.addEventListener("click", () => copy(message(p.name, p.url)));
      acts.append(line, cp);
      row.append(nm, acts);
      list.appendChild(row);
    }
  }

  $("make").addEventListener("click", async () => {
    const names = [...$("names").querySelectorAll("input")].map((i) => i.value.trim());
    if (names.some((n) => !n)) return alert("名前が空の欄があります");
    if (new Set(names).size !== names.length) return alert("同じ名前が2つあります。区別できるように変えてください");
    if (!window.crypto || !crypto.subtle) return alert("このブラウザでは作れません。SafariかChromeで開いてください");

    $("make").disabled = true;
    try {
      const perm = XR.derangement(names.length);
      if (!XR.isValidAssignment(perm)) throw new Error("割り当てのチェックに失敗しました");
      const b = $("budget").value.trim();
      const d = $("date").value.trim();
      const base = baseUrl();
      const people = [];
      for (let g = 0; g < names.length; g++) {
        const payload = { v: 1, n: names, g, r: perm[g] };
        if (b) payload.b = b;
        if (d) payload.d = d;
        const token = await XR.seal(payload);
        // 念のため、作ったURLが正しく読めるか確かめる
        const back = await XR.open(token);
        if (back.g !== g || back.r !== perm[g]) throw new Error("URLの確認に失敗しました");
        people.push({ name: names[g], url: `${base}?t=${token}` });
      }
      const saved = { createdAt: new Date().toISOString(), people };
      if (!store.set(saved)) {
        alert("このブラウザでは発行結果を保存できませんでした。\nこの画面を閉じる前に、全員にURLを送ってください。");
      }
      render(saved);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      console.error(e);
      alert("エラーが起きました：" + e.message + "\nもう一度押してください。");
    } finally {
      $("make").disabled = false;
    }
  });

  $("redo").addEventListener("click", () => {
    const ok = confirm(
      "割り当てをやり直しますか？\n\nもう送ったURLがある場合、そのURLは使えなくなるわけではないので、" +
      "古いURLと新しいURLが混ざると割り当てがくずれます。\n\n" +
      "やり直したら、必ず全員に新しいURLを送り直してください。"
    );
    if (!ok) return;
    store.clear();
    $("links").hidden = true;
    $("setup").hidden = false;
  });

  const saved = store.get();
  if (saved && Array.isArray(saved.people) && saved.people.length) render(saved);
})();
</script>
</body>
</html>
